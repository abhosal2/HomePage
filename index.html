<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aryan | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05060f;
      --grid:#0b1630;
      --neon-blue:#24c8ff;
      --neon-red:#ff3b4e;
      --text:#e9f3ff;
      --maxw: 1000px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background: var(--bg);
      overflow:hidden;
    }

    .scene{
      position:fixed; inset:0; overflow:hidden;
      perspective: 900px;
      background: radial-gradient(1200px 800px at 20% 10%, rgba(36,200,255,.06), transparent 60%),
                  radial-gradient(1100px 780px at 85% 20%, rgba(255,59,78,.06), transparent 60%),
                  radial-gradient(1000px 700px at 50% 120%, rgba(36,200,255,.05), transparent 70%);
    }

    .stars, .stars:before, .stars:after{
      content:""; position:absolute; inset:-20%;
      background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 3px 3px; opacity:.15;
      animation: drift 120s linear infinite;
    }
    .stars:before{opacity:.25; filter:blur(.5px); animation-duration: 160s}
    .stars:after{opacity:.08; filter:blur(1px); animation-duration: 200s}
    @keyframes drift{to{transform:translate3d(-200px, -120px, 0)}}

    .sweeps{
      position:absolute; inset:0; pointer-events:none; mix-blend-mode: screen;
      background:
        radial-gradient(400px 220px at -10% 60%, rgba(36,200,255,.25), transparent 65%),
        radial-gradient(380px 220px at 110% 40%, rgba(255,59,78,.22), transparent 65%);
      animation: sweepMove 14s ease-in-out infinite alternate;
    }
    @keyframes sweepMove{
      0%{transform:translate3d(-6%, -4%, 0)}
      100%{transform:translate3d(6%, 5%, 0)}
    }

    .grid{
      position:absolute; left:-5vw; right:-5vw; bottom:-15vh; height:80vh;
      transform: rotateX(62deg) translateZ(-200px);
      transform-origin: top center; filter: drop-shadow(0 0 12px rgba(36,200,255,.25));
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 50px 50px; background-position: center;
    }
    .grid:before{
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(600px 120px at 50% 0%, rgba(36,200,255,.18), transparent 70%),
        radial-gradient(500px 110px at 50% 10%, rgba(255,59,78,.12), transparent 75%);
      pointer-events:none;
    }
    .grid-lines{
      position:absolute; inset:0; background: repeating-linear-gradient( to bottom, transparent 0 48px, rgba(36,200,255,.5) 49px 50px );
      -webkit-mask: linear-gradient(to top, transparent, black 30%);
              mask: linear-gradient(to top, transparent, black 30%);
      mix-blend-mode: screen; opacity:.25; animation: gridPulse 2.6s ease-in-out infinite;
    }
    @keyframes gridPulse{ 50%{opacity:.38} }

    .scanline{
      position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.06), transparent);
      background-size: 100% 180px; animation: scan 4.2s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes scan{ to{background-position-y: 180px} }

    .wrap{ position:relative; z-index:10; min-height:100dvh; display:grid; place-items:center; text-align:center; padding: clamp(16px, 3vw, 40px); }

    .card{
      width:min(92vw, var(--maxw));
      backdrop-filter: blur(8px) saturate(120%);
      background: rgba(5,8,18,.45);
      border: 1px solid rgba(36,200,255,.18);
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(36,200,255,.12), 0 0 80px rgba(255,59,78,.08) inset;
      padding: clamp(20px, 5vw, 56px);
    }

    h1{
      font-family: 'Orbitron', ui-sans-serif;
      font-weight:900; letter-spacing:.04em; line-height:1.02;
      font-size: clamp(36px, 8vw, 86px);
      margin: 0 0 16px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        0 0 6px rgba(36,200,255,.65),
        0 0 18px rgba(36,200,255,.35),
        0 0 36px rgba(255,59,78,.2);
    }

    .subtitle{
      font-family: 'Orbitron', ui-sans-serif; letter-spacing:.12em; text-transform:uppercase;
      opacity:.88; margin-bottom: 28px; font-size: clamp(12px, 2.6vw, 16px);
    }

    .cta{
      display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:center;
    }

    .btn{
      --h: 52px;
      height: var(--h); padding: 0 22px; border-radius: 14px;
      display:inline-grid; place-items:center; text-decoration:none; position:relative;
      font-family:'Orbitron', ui-sans-serif; font-weight:700; letter-spacing:.06em;
      color: var(--text); isolation:isolate;
      border:1px solid rgba(36,200,255,.45);
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
      background: linear-gradient( to bottom, rgba(8,26,46,.7), rgba(6,16,34,.6) );
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,59,78,.6); box-shadow: 0 0 18px rgba(255,59,78,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .btn:active{ transform: translateY(0); }

    .btn.blue:before, .btn.red:before{
      content:""; position:absolute; inset:-2px; border-radius:inherit; z-index:-1; filter: blur(10px);
    }
    .btn.blue:before{ background: radial-gradient(60% 120% at 50% 80%, rgba(36,200,255,.45), transparent 70%); }
    .btn.red:before{ background: radial-gradient(60% 120% at 50% 80%, rgba(255,59,78,.45), transparent 70%); }

    .footer{ margin-top: 20px; opacity:.7; font-size: 12px }

    @media (prefers-reduced-motion: reduce){
      .sweeps, .grid-lines, .scanline, .stars{ animation: none !important }
    }
      .audio-toggle{
      position: fixed; right: 16px; bottom: 16px; z-index: 200;
      width: 44px; height: 44px; border-radius: 12px; border:1px solid rgba(36,200,255,.45);
      background: linear-gradient( to bottom, rgba(8,26,46,.9), rgba(6,16,34,.85) );
      color: var(--text); font-size: 18px; cursor: pointer;
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .audio-toggle:hover{ transform: translateY(-1px); border-color: rgba(255,59,78,.6); box-shadow: 0 0 18px rgba(255,59,78,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .audio-toggle:active{ transform: translateY(0); }
      .audio-toggle{
      position: fixed; right: 16px; bottom: 16px; z-index: 20;
      width: 44px; height: 44px; border-radius: 12px; border:1px solid rgba(36,200,255,.45);
      background: linear-gradient( to bottom, rgba(8,26,46,.9), rgba(6,16,34,.85) );
      color: var(--text); font-size: 18px; cursor: pointer;
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .audio-toggle:hover{ transform: translateY(-1px); border-color: rgba(255,59,78,.6); box-shadow: 0 0 18px rgba(255,59,78,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .audio-toggle:active{ transform: translateY(0); }

    /* ===== NEW INTRO (Tron Grid + Lightcycle) ===== */
    .intro{ position:fixed; inset:0; z-index: 120; display:grid; place-items:center; background:#04050b; overflow:hidden; }
    .intro__bg{ position:absolute; inset:0; perspective:1000px; }
    .intro__floor{ position:absolute; left:-10vw; right:-10vw; bottom:-20vh; height:90vh; transform: rotateX(62deg) translateZ(-200px); transform-origin: top center; background-image: linear-gradient(#0a1a36 1px, transparent 1px), linear-gradient(90deg, #0a1a36 1px, transparent 1px); background-size: 52px 52px; }
    .intro__floor:after{ content:""; position:absolute; inset:0; background: radial-gradient(700px 160px at 50% 0%, rgba(36,200,255,.2), transparent 70%); opacity:.9; }

    /* grid glow sweep */
    .intro__sweep{ position:absolute; inset:0; mix-blend-mode:screen; background: radial-gradient(600px 300px at -10% 60%, rgba(36,200,255,.22), transparent 65%), radial-gradient(600px 300px at 110% 40%, rgba(255,59,78,.18), transparent 65%); animation: introSweep 6s ease-in-out infinite; opacity:.7 }
    @keyframes introSweep{ 50%{ transform: translate3d(4%,3%,0) } }

    /* Lightcycle path using offset-path */
    .intro__trail{ position:absolute; width:100%; height:100%; top:0; left:0; filter: drop-shadow(0 0 10px rgba(36,200,255,.8)) drop-shadow(0 0 22px rgba(36,200,255,.5)); }
    .intro__trail svg path{ stroke:url(#trailGrad); stroke-width:6; fill:none; stroke-linecap:round; stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: trailDraw 1600ms ease-out 200ms forwards; }
    @keyframes trailDraw{ to{ stroke-dashoffset: 0 } }

    /* Lightcycle */
    .cycle{ position:absolute; width:46px; height:22px; border-radius:12px; background: linear-gradient(90deg, rgba(12,40,70,.8), rgba(10,60,110,.9)); box-shadow:0 0 16px rgba(36,200,255,.6) inset, 0 0 20px rgba(36,200,255,.6); outline: 1px solid rgba(36,200,255,.5);
      offset-path: path('M 40 520 C 220 460, 430 360, 680 360 C 840 360, 920 420, 980 480');
      offset-distance: 0%; offset-rotate: 0deg; transform: translate(-23px,-11px);
      animation: cycleMove 1500ms ease-out 200ms forwards;
    }
    .cycle:before, .cycle:after{ content:""; position:absolute; top:50%; width:12px; height:12px; border-radius:50%; transform:translateY(-50%); background: radial-gradient(circle, #9be7ff 0 45%, transparent 55%); box-shadow: 0 0 8px rgba(36,200,255,.9); }
    .cycle:before{ left:-2px }
    .cycle:after{ right:-2px }
    @keyframes cycleMove{ to{ offset-distance: 100% } }

    /* Title reveal */
    .intro__title{ position:absolute; bottom:18%; width:100%; text-align:center; font-family:'Orbitron', ui-sans-serif; text-transform:uppercase; letter-spacing:.08em; font-weight:900; font-size:clamp(28px,7vw,76px); color:#eaf7ff; opacity:0; transform:translateY(18px) scale(.98); text-shadow: 0 0 10px rgba(36,200,255,.8), 0 0 26px rgba(36,200,255,.35), 0 0 60px rgba(255,59,78,.25); animation:introTitleIn 1100ms ease-out 1700ms forwards; }
    @keyframes introTitleIn{ to{ opacity:1; transform:translateY(0) scale(1) } }

    /* Fade out */
    .intro--hide{ animation: introOut 900ms ease forwards; pointer-events:none; }
    @keyframes introOut{ to{ opacity:0; visibility:hidden } }

    .intro__skip{ position:absolute; right:16px; top:16px; z-index:140; border:1px solid rgba(36,200,255,.45); border-radius:10px; padding:6px 10px; background: rgba(8,26,46,.7); color:var(--text); font-family:'Orbitron', ui-sans-serif; letter-spacing:.06em; cursor:pointer; }
    .intro__skip:hover{ border-color: rgba(255,59,78,.6) }

    @media (prefers-reduced-motion: reduce){
      .cycle, .intro__trail svg path, .intro__title{ animation:none !important }
    }
    }
      /* --- TEMP VISIBILITY OVERRIDE --- */
    /* If the intro ever blocks rendering, this hides it entirely. */
    .intro{ display:none !important; }
  </style>
  <script>
    (function(){
      // INTRO control
      const intro = document.getElementById('intro');
      const skip = document.getElementById('skipIntro');
      const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const played = sessionStorage.getItem('introPlayed');
      function endIntro(){
        if(!intro) return;
        intro.classList.add('intro--hide');
        setTimeout(()=>{ intro.style.display='none'; }, 900);
        sessionStorage.setItem('introPlayed','1');
      }
      if(played || REDUCED){ endIntro(); } else { setTimeout(endIntro, 3600); }
      skip?.addEventListener('click', endIntro);

      // AUDIO toggle (robust)
      const btn = document.getElementById('audioToggle');
      const audio = document.getElementById('bgm');
      if(btn && audio){
        const saved = localStorage.getItem('bgmState'); // 'on' | 'off'
        audio.volume = 0.14; // slightly louder per your note
        if(saved === 'on'){
          audio.muted = false;
          audio.play().catch(()=>{});
        }else{
          audio.pause();
        }
        function updateIcon(){
          const playing = !audio.paused;
          btn.textContent = playing ? '🔊' : '🔇';
          btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
          btn.setAttribute('aria-label', playing ? 'Pause background music' : 'Play background music');
        }
        function toggle(){
          if(audio.paused){
            audio.muted = false;
            audio.play().then(()=>{ localStorage.setItem('bgmState','on'); updateIcon(); }).catch(console.warn);
          }else{
            audio.pause(); localStorage.setItem('bgmState','off'); updateIcon();
          }
        }
        btn.addEventListener('click', toggle);
        // Also start on first page interaction anywhere (helps mobile)
        window.addEventListener('pointerdown', function once(){
          if(audio.paused && localStorage.getItem('bgmState')!== 'off'){
            audio.muted = false; audio.play().catch(()=>{}); updateIcon();
          }
          window.removeEventListener('pointerdown', once, {passive:true});
        }, {passive:true});
        updateIcon();
      }
    })();
  </script>
  <script>
    // --- SAFETY SWITCH ---
    (function(){
      function endIntroNow(){
        var intro = document.getElementById('intro');
        if(intro){ intro.classList.add('intro--hide'); intro.style.display = 'none'; }
        document.body.style.overflow = 'auto';
      }
      // Allow ?nointro=1 or #safe to bypass
      if(location.search.indexOf('nointro=1')!==-1 || location.hash.indexOf('safe')!==-1){ endIntroNow(); }
      // If nothing appears within 2000ms, hide the intro automatically
      setTimeout(function(){
        var w = window.innerWidth || 0, h = window.innerHeight || 0;
        var intro = document.getElementById('intro');
        // If intro still visible and taking full screen, collapse it
        if(intro && intro.offsetParent !== null){ endIntroNow(); }
      }, 2000);
      // If any runtime error occurs, also bail out of intro
      window.addEventListener('error', endIntroNow);
    })();
  </script>
</body>
</html>
