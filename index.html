<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aryan | Home</title>
  <!-- CRT-style font -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!-- Preload audio (same folder as this HTML). Adjust path if needed. -->
  <link rel="preload" as="audio" href="./Punkrock.mp3" type="audio/mpeg">

  <style>
    :root{
      --bg:#05060f;
      --crt-green:#19ff5e;
      --text:#c9ffd8;
      --cell:60px;           /* desktop default */
      --maxw:1000px;

      /* Intro timing */
      --intro-rise:1.6s;
      --intro-hold:0.3s;
      --intro-fade:0.6s;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'VT323',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--text);
      background:#000; /* solid base so grid pops */
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    /* ===== Full-viewport CRT grid ===== */
    .crt-grid{
      position:fixed;inset:0;z-index:-1;
      background-image:
        repeating-linear-gradient(0deg,transparent 0 calc(var(--cell) - 1px), rgba(25,255,94,0.45) calc(var(--cell) - 1px) var(--cell)),
        repeating-linear-gradient(90deg,transparent 0 calc(var(--cell) - 1px), rgba(25,255,94,0.45) calc(var(--cell) - 1px) var(--cell));
      box-shadow:inset 0 -160px 120px -40px rgba(25,255,94,0.25);
    }

    /* optional faint scanlines */
    .scanlines{
      position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.08;
      background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.7) 0 1px,transparent 1px 3px);
      mix-blend-mode:screen;
    }

    .wrap{
      position:relative;z-index:1;height:100vh;display:grid;place-items:center;text-align:center;padding:40px;

      /* Start hidden until intro completes */
      opacity:0;
      transform:translateY(8px);
      transition:opacity .5s ease, transform .5s ease;
    }
    body.revealed .wrap{
      opacity:1;
      transform:none;
    }

    /* Ensure modern mobile browsers use the “small viewport” height accounting for UI chrome */
    @supports (height: 100svh){
      .wrap{ height:100svh; }
    }

    .card{
      width:min(92vw,var(--maxw));
      background:rgba(0,0,0,.55);
      border:1px solid rgba(25,255,94,.35);
      border-radius:20px;
      box-shadow:0 0 24px rgba(25,255,94,.2) inset,0 0 40px rgba(0,0,0,.6);
      padding:40px;
    }

    h1{
      font-size:clamp(40px,12vw,120px);
      line-height:.9;letter-spacing:4px;text-transform:uppercase;
      color:var(--crt-green);
      text-shadow:0 0 6px rgba(25,255,94,.9),0 0 18px rgba(25,255,94,.5),0 0 32px rgba(25,255,94,.35);
      -webkit-text-stroke:2px rgba(0,0,0,.6);
      margin-bottom:18px;
    }

    .subtitle{
      font-size:clamp(16px,3.2vw,26px);letter-spacing:4px;text-transform:uppercase;color:#a9ffc7;opacity:.9;margin-bottom:28px;
    }

    .cta{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;}

    .btn{
      height:56px;padding:0 26px;border-radius:12px;text-decoration:none;display:grid;place-items:center;
      color:var(--crt-green);font-size:22px;letter-spacing:2px;
      border:1px solid rgba(25,255,94,.4);
      background:rgba(0,0,0,.65);
      box-shadow:0 0 14px rgba(25,255,94,.25) inset,0 0 18px rgba(25,255,94,.18);
      transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease;
      touch-action:manipulation;
    }
    .btn:hover{transform:translateY(-1px);border-color:rgba(25,255,94,.8);box-shadow:0 0 18px rgba(25,255,94,.35),0 0 24px rgba(25,255,94,.25) inset;}

    /* Audio Toggle */
    .audio-toggle{
      position:fixed;right:16px;bottom:16px;z-index:9999;
      width:44px;height:44px;border-radius:12px;border:1px solid rgba(25,255,94,.45);
      background:rgba(0,0,0,.8);
      color:var(--text);font-size:18px;cursor:pointer;
      box-shadow:0 0 12px rgba(25,255,94,.22) inset,0 0 22px rgba(25,255,94,.16);
      transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease;
      opacity:0; transform:translateY(6px);
      pointer-events:none;
      transition:opacity .4s ease .05s, transform .4s ease .05s;
    }
    body.revealed #audioToggle{
      opacity:1; transform:none; pointer-events:auto;
    }
    .audio-toggle:hover{transform:translateY(-1px);border-color:rgba(25,255,94,.8);box-shadow:0 0 18px rgba(25,255,94,.25),0 0 28px rgba(25,255,94,.28) inset;}

    /* ===== Mobile-only top bar (hidden on larger screens) ===== */
    .mobile-topbar, .mobile-menu{ display:none; }
    body.revealed .mobile-topbar{ opacity:1; transform:none; }
    .mobile-topbar{
      opacity:0; transform:translateY(-6px);
      transition:opacity .4s ease .05s, transform .4s ease .05s;
    }

    /* ===== INTRO OVERLAY (dual beams) ===== */
    .intro{
      position:fixed; inset:0; z-index:9998;
      background:#000;
      overflow:hidden;
      opacity:1;
      pointer-events:auto;
    }

    .beam{
      position:absolute; left:0; right:0;
      background:
        repeating-linear-gradient(0deg,transparent 0 calc(var(--cell) - 1px), rgba(25,255,94,0.55) calc(var(--cell) - 1px) var(--cell)),
        repeating-linear-gradient(90deg,transparent 0 calc(var(--cell) - 1px), rgba(25,255,94,0.55) calc(var(--cell) - 1px) var(--cell));
      box-shadow:
        0 0 24px rgba(25,255,94,.45),
        0 0 80px rgba(25,255,94,.3),
        0 -40px 120px -10px rgba(25,255,94,.25) inset;
      filter:brightness(1);
    }

    .beam--top{
      top:0; height:0; transform-origin:top center;
      animation: beam-down var(--intro-rise) cubic-bezier(.22,.85,.3,1) forwards,
                 beam-bright var(--intro-hold) linear forwards var(--intro-rise);
    }

    .beam--bottom{
      bottom:0; height:0; transform-origin:bottom center;
      animation: beam-up var(--intro-rise) cubic-bezier(.22,.85,.3,1) forwards,
                 beam-bright var(--intro-hold) linear forwards var(--intro-rise);
    }

    /* Soft glow where they meet */
    .meet-glow{
      position:absolute; left:0; right:0; top:50%;
      height:1px; transform:translateY(-.5px);
      background: radial-gradient(closest-side, rgba(25,255,94,.55), rgba(25,255,94,.18) 60%, transparent 70%);
      opacity:0;
      pointer-events:none;
      animation: meet-pop .28s ease forwards calc(var(--intro-rise));
    }

    .intro.reveal{
      animation: intro-fade var(--intro-fade) ease forwards;
    }

    @keyframes beam-down{ 0%{height:0} 100%{height:50vh} }
    @keyframes beam-up  { 0%{height:0} 100%{height:50vh} }
    @keyframes beam-bright{ 0%{filter:brightness(1)} 100%{filter:brightness(1.15)} }
    @keyframes meet-pop{ 0%{opacity:0; transform:translateY(-.5px) scaleY(0.6)} 100%{opacity:1; transform:translateY(-.5px) scaleY(1)} }
    @keyframes intro-fade{ 0%{opacity:1} 100%{opacity:0; pointer-events:none} }

    /* ===== Mobile-only polish (does NOT affect laptops/desktops) ===== */
    @media (max-width: 640px){
      :root{
        --cell:34px;          /* tighter grid for phones */
        --maxw:560px;
      }

      body{ overflow:auto; }  /* avoid accidental clipping on short viewports */

      .mobile-topbar{
        position:fixed;top:0;left:0;right:0;z-index:1000;
        height:56px;
        display:flex;align-items:center;justify-content:space-between;
        padding:0 14px;
        background:rgba(0,0,0,.7);
        border-bottom:1px solid rgba(25,255,94,.35);
        box-shadow:0 6px 16px rgba(0,0,0,.5);
        backdrop-filter:blur(6px);
      }
      .brand{
        color:var(--crt-green);
        font-size:24px;letter-spacing:3px;text-transform:uppercase;
        text-shadow:0 0 6px rgba(25,255,94,.7),0 0 16px rgba(25,255,94,.3);
      }
      .hamburger{
        width:44px;height:44px;border-radius:10px;border:1px solid rgba(25,255,94,.45);
        background:rgba(0,0,0,.85);color:var(--text);font-size:22px;cursor:pointer;
        display:grid;place-items:center;
        box-shadow:0 0 12px rgba(25,255,94,.22) inset,0 0 22px rgba(25,255,94,.16);
      }

      .mobile-menu{
        position:fixed;top:56px;left:0;right:0;z-index:999;
        display:block;
        transform:translateY(-110%);
        transition:transform .22s ease;
        background:rgba(0,0,0,.9);
        border-bottom:1px solid rgba(25,255,94,.35);
        backdrop-filter:blur(6px);
      }
      .mobile-menu.open{ transform:translateY(0); }

      .mobile-menu .menu-grid{
        display:grid;grid-template-columns:1fr 1fr;gap:12px;
        padding:14px;
      }
      .mobile-link{
        height:48px;display:grid;place-items:center;text-decoration:none;border-radius:12px;
        border:1px solid rgba(25,255,94,.35);
        color:var(--crt-green);font-size:18px;letter-spacing:2px;background:rgba(0,0,0,.65);
        box-shadow:0 0 10px rgba(25,255,94,.18) inset,0 0 18px rgba(0,0,0,.45);
      }

      .wrap{
        padding:20px;
        /* push content below top bar */
        padding-top:84px;
      }

      .card{
        padding:24px 18px;
        border-radius:16px;
        box-shadow:0 0 18px rgba(25,255,94,.18) inset,0 0 28px rgba(0,0,0,.6);
      }

      h1{
        -webkit-text-stroke:1px rgba(0,0,0,.65);
        letter-spacing:2px;
        margin-bottom:14px;
      }

      .subtitle{
        letter-spacing:2px;
        margin-bottom:22px;
        opacity:.95;
      }

      .cta{
        gap:12px;
        justify-content:center;
      }

      /* Two-column, thumb-friendly buttons on phones */
      .btn{
        width:calc(50% - 6px);
        min-width:140px;
        height:52px;
        font-size:20px;
        padding:0 18px;
      }

      .audio-toggle{
        right:12px;bottom:12px;width:48px;height:48px;font-size:18px;
      }

      .scanlines{ opacity:.06; } /* slightly softer on small displays */
    }

    /* Accessibility: respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .intro, .beam, .meet-glow{ animation:none !important; }
      body{ overflow:auto; }
      .wrap{ opacity:1; transform:none; }
      #audioToggle{ opacity:1; transform:none; pointer-events:auto; }
      .intro{ display:none; }
    }
  </style>
</head>
<body>
  <!-- Background grid and scanlines -->
  <div class="crt-grid" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- ===== Intro Overlay: two beams meet at center ===== -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="beam beam--top"></div>
    <div class="beam beam--bottom"></div>
    <div class="meet-glow"></div>
  </div>

  <!-- ===== Mobile Top Bar (phones only) ===== -->
  <header class="mobile-topbar" aria-label="Mobile navigation">
    <div class="brand">ARYAN</div>
    <button id="hamburger" class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">☰</button>
  </header>

  <nav id="mobileMenu" class="mobile-menu" aria-hidden="true">
    <div class="menu-grid">
      <a class="mobile-link" href="https://calendar.google.com/" target="_blank" rel="noopener">Calendar</a>
      <a class="mobile-link" href="https://outlook.office.com/" target="_blank" rel="noopener">Outlook</a>
      <a class="mobile-link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>
      <a class="mobile-link" href="https://www.google.com/" target="_blank" rel="noopener">Google</a>
      <a class="mobile-link" href="#home" onclick="location.reload();return false;">Home</a>
    </div>
  </nav>
  <!-- ===== /Mobile Top Bar ===== -->

  <!-- Audio -->
  <audio id="bgm" preload="auto" loop muted autoplay playsinline>
    <source src="./Punkrock.mp3?v=1" type="audio/mpeg">
  </audio>

  <button id="audioToggle" class="audio-toggle" aria-label="Play background music" aria-pressed="false">🔇</button>

  <main class="wrap">
    <section class="card">
      <h1>Welcome back Aryan</h1>
      <p class="subtitle">SYSTEM ONLINE · ACCESS YOUR HUB</p>
      <nav class="cta" aria-label="Primary">
        <a class="btn" href="https://calendar.google.com/" target="_blank" rel="noopener">Calendar</a>
        <a class="btn" href="https://outlook.office.com/" target="_blank" rel="noopener">Outlook</a>
        <a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>
        <a class="btn" href="https://www.google.com/" target="_blank" rel="noopener">Google</a>
        <a class="btn" href="#home" onclick="location.reload();return false;">Home</a>
      </nav>
    </section>
  </main>

  <script>
    // ===== Intro sequencing (two beams -> meet -> fade -> reveal) =====
    (function(){
      const intro = document.getElementById('intro');
      const root = document.documentElement;

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced){
        document.body.classList.add('revealed');
        intro?.remove();
        return;
      }

      const parseTime = v => {
        if(!v) return 0;
        v = String(v).trim();
        if(v.endsWith('ms')) return parseFloat(v);
        if(v.endsWith('s'))  return parseFloat(v)*1000;
        return parseFloat(v)||0;
      };
      const rise = parseTime(getComputedStyle(root).getPropertyValue('--intro-rise'));
      const hold = parseTime(getComputedStyle(root).getPropertyValue('--intro-hold'));
      const fade = parseTime(getComputedStyle(root).getPropertyValue('--intro-fade'));
      const total = rise + hold + fade;

      // After both beams reach the center and hold briefly, fade the overlay
      setTimeout(()=> intro?.classList.add('reveal'), rise + hold);

      // Then reveal the page and remove overlay
      setTimeout(()=>{
        document.body.classList.add('revealed');
        setTimeout(()=> intro?.remove(), fade + 50);
      }, total);
    })();

    // ===== Audio toggle + autoplay policy friendly boot =====
    (function(){
      const btn = document.getElementById('audioToggle');
      const audio = document.getElementById('bgm');
      if(!btn || !audio) return;

      let bootstrapped = false;
      audio.volume = 0.14;

      function updateIcon(){
        btn.textContent = audio.paused ? '🔇' : '🔊';
        btn.setAttribute('aria-pressed', String(!audio.paused));
      }

      function tryStartMuted(){
        if (bootstrapped) return;
        bootstrapped = true;
        audio.play().catch(()=>{/* wait for user gesture */});
      }

      function unlockAudio(unmute=false){
        const start = () => {
          if (unmute) audio.muted = false;
          return audio.play().then(updateIcon).catch(err=>{
            console.warn('Autoplay blocked until explicit user action:', err);
            updateIcon();
          });
        };
        if (audio.readyState >= 2) start();
        else audio.addEventListener('canplaythrough', start, { once:true });
      }

      btn.addEventListener('click', ()=>{
        if (audio.paused){ unlockAudio(true); }
        else { audio.pause(); updateIcon(); }
      });

      audio.addEventListener('play', updateIcon);
      audio.addEventListener('pause', updateIcon);

      const firstGesture = () => {
        unlockAudio(false);
        window.removeEventListener('pointerdown', firstGesture);
        window.removeEventListener('keydown', firstGesture);
        window.removeEventListener('touchstart', firstGesture);
      };
      window.addEventListener('pointerdown', firstGesture, { once:true });
      window.addEventListener('keydown', firstGesture, { once:true });
      window.addEventListener('touchstart', firstGesture, { once:true });

      tryStartMuted();
      updateIcon();

      audio.addEventListener('error', ()=>{
        console.error('Audio failed to load. Check that "Punkrock.mp3" exists, exact casing, and path.');
      });
    })();

    // ===== Mobile hamburger menu toggle (phones only) =====
    (function(){
      const btn = document.getElementById('hamburger');
      const menu = document.getElementById('mobileMenu');
      if(!btn || !menu) return;

      function toggle(open){
        const isOpen = (open !== undefined) ? open : !menu.classList.contains('open');
        menu.classList.toggle('open', isOpen);
        menu.setAttribute('aria-hidden', String(!isOpen));
        btn.setAttribute('aria-expanded', String(isOpen));
        btn.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
      }

      btn.addEventListener('click', ()=>toggle());
      menu.addEventListener('click', (e)=>{
        const target = e.target;
        if(target.closest('a')) toggle(false);
      });
      document.addEventListener('keydown',(e)=>{
        if(e.key==='Escape') toggle(false);
      });
    })();
  </script>
</body>
</html>
