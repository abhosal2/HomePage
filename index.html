<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aryan | Home</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05060f;
      --crt-green:#19ff5e;
      --text:#c9ffd8;
      --cell:60px;
      --maxw:1000px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      font-family:'VT323',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--text);
      background:#000;
      overflow:hidden;
      opacity:0;
      animation: fadeIn 1.2s ease forwards;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* CRT grid — now drifts slowly, like an old vector display */
    .crt-grid{
      position:fixed;
      inset:0;
      z-index:-1;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0 calc(var(--cell) - 1px),
          rgba(25,255,94,0.45) calc(var(--cell) - 1px) var(--cell)
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0 calc(var(--cell) - 1px),
          rgba(25,255,94,0.45) calc(var(--cell) - 1px) var(--cell)
        );
      box-shadow:inset 0 -160px 120px -40px rgba(25,255,94,0.25);
      animation: gridDrift 8s linear infinite;
    }

    @keyframes gridDrift {
      from { background-position: 0 0; }
      to   { background-position: 0 var(--cell); }
    }

    /* Scanlines — moved ABOVE the content so text looks like it's on the tube */
    .scanlines{
      position:fixed;
      inset:0;
      z-index:2000;
      pointer-events:none;
      opacity:.12;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.9) 0 1px,
          transparent 1px 3px
        );
    }

    /* NEW: vignette + faint flicker, like curved CRT glass */
    .crt-glass{
      position:fixed;
      inset:0;
      z-index:2001;
      pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%      { opacity: .94; }
    }

    /* NEW: slow rolling bright band */
    .scanbar{
      position:fixed;
      left:0;
      right:0;
      top:-20%;
      height:20%;
      z-index:2002;
      pointer-events:none;
      background:linear-gradient(to bottom, transparent, rgba(25,255,94,.06), transparent);
      animation: roll 7s linear infinite;
    }

    @keyframes roll {
      to { top: 110%; }
    }

    .wrap{
      position:relative;
      z-index:1;
      height:100vh;
      display:grid;
      place-items:center;
      text-align:center;
      padding:40px;
    }

    @supports (height: 100svh){
      .wrap{ height:100svh; }
    }

    .card{
      width:min(92vw,var(--maxw));
      background:rgba(0,0,0,.55);
      border:1px solid rgba(25,255,94,.35);
      border-radius:20px;
      box-shadow:
        0 0 24px rgba(25,255,94,.2) inset,
        0 0 40px rgba(0,0,0,.6);
      padding:40px;
    }

    /* NEW: terminal prompt line above the title */
    .prompt{
      font-size:clamp(16px,2.6vw,22px);
      letter-spacing:2px;
      color:rgba(25,255,94,.6);
      text-align:left;
      margin-bottom:14px;
    }

    h1{
      font-size:clamp(40px,12vw,120px);
      line-height:.9;
      letter-spacing:4px;
      text-transform:uppercase;
      color:var(--crt-green);
      /* red/blue fringe = subtle chromatic aberration */
      text-shadow:
        -2px 0 rgba(255,40,80,.35),
         2px 0 rgba(40,160,255,.35),
         0 0 6px rgba(25,255,94,.9),
         0 0 18px rgba(25,255,94,.5),
         0 0 32px rgba(25,255,94,.35);
      -webkit-text-stroke:2px rgba(0,0,0,.6);
      margin-bottom:18px;
    }

    /* NEW: blinking block cursor */
    .cursor{
      display:inline-block;
      width:.5em;
      height:.8em;
      margin-left:.1em;
      vertical-align:baseline;
      background:var(--crt-green);
      box-shadow:0 0 12px rgba(25,255,94,.8);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .subtitle{
      font-size:clamp(16px,3.2vw,26px);
      letter-spacing:4px;
      text-transform:uppercase;
      color:#a9ffc7;
      opacity:.9;
      margin-bottom:28px;
      min-height:1.2em;
    }

    .cta{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      align-items:center;
      justify-content:center;
    }

    .btn{
      height:56px;
      padding:0 26px;
      border-radius:4px;              /* squarer = more retro */
      text-decoration:none;
      display:grid;
      place-items:center;
      color:var(--crt-green);
      font-size:22px;
      letter-spacing:2px;
      text-transform:uppercase;
      border:1px solid rgba(25,255,94,.4);
      background:rgba(0,0,0,.65);
      box-shadow:
        0 0 14px rgba(25,255,94,.25) inset,
        0 0 18px rgba(25,255,94,.18);
      transition:
        transform .12s ease,
        box-shadow .2s ease,
        border-color .2s ease;
      touch-action:manipulation;
    }

    /* NEW: [ BRACKETS ] around labels */
    .btn::before{ content:"[ "; opacity:.5; }
    .btn::after { content:" ]"; opacity:.5; }
    .btn{ grid-auto-flow:column; }

    /* NEW: hover inverts like a selected terminal menu item */
    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-1px);
      color:#000;
      background:var(--crt-green);
      border-color:var(--crt-green);
      outline:none;
      box-shadow:
        0 0 18px rgba(25,255,94,.6),
        0 0 36px rgba(25,255,94,.35);
    }

    /* Mobile menu */
    .mobile-topbar,
    .mobile-menu{
      display:none;
    }

    @media (max-width: 640px){
      :root{
        --cell:34px;
        --maxw:560px;
      }

      body{ overflow:auto; }

      .mobile-topbar{
        position:fixed;
        top:0;
        left:0;
        right:0;
        z-index:1000;
        height:56px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 14px;
        background:rgba(0,0,0,.7);
        border-bottom:1px solid rgba(25,255,94,.35);
        box-shadow:0 6px 16px rgba(0,0,0,.5);
        backdrop-filter:blur(6px);
      }

      .brand{
        color:var(--crt-green);
        font-size:24px;
        letter-spacing:3px;
        text-transform:uppercase;
        text-shadow:
          0 0 6px rgba(25,255,94,.7),
          0 0 16px rgba(25,255,94,.3);
      }

      .hamburger{
        width:44px;
        height:44px;
        border-radius:4px;
        border:1px solid rgba(25,255,94,.45);
        background:rgba(0,0,0,.85);
        color:var(--text);
        font-size:22px;
        cursor:pointer;
        display:grid;
        place-items:center;
        box-shadow:
          0 0 12px rgba(25,255,94,.22) inset,
          0 0 22px rgba(25,255,94,.16);
      }

      .mobile-menu{
        position:fixed;
        top:56px;
        left:0;
        right:0;
        z-index:999;
        display:block;
        transform:translateY(-110%);
        transition:transform .22s ease;
        background:rgba(0,0,0,.9);
        border-bottom:1px solid rgba(25,255,94,.35);
        backdrop-filter:blur(6px);
      }

      .mobile-menu.open{
        transform:translateY(0);
      }

      .menu-grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
        padding:14px;
      }

      .mobile-link{
        height:48px;
        display:grid;
        place-items:center;
        text-decoration:none;
        border-radius:4px;
        border:1px solid rgba(25,255,94,.35);
        color:var(--crt-green);
        font-size:18px;
        letter-spacing:2px;
        text-transform:uppercase;
        background:rgba(0,0,0,.65);
        box-shadow:
          0 0 10px rgba(25,255,94,.18) inset,
          0 0 18px rgba(0,0,0,.45);
      }

      .wrap{
        padding:20px;
        padding-top:84px;
      }

      .card{
        padding:24px 18px;
        border-radius:16px;
      }

      h1{
        -webkit-text-stroke:1px rgba(0,0,0,.65);
        letter-spacing:2px;
        margin-bottom:14px;
      }

      .subtitle{
        letter-spacing:2px;
        margin-bottom:22px;
      }

      .cta{
        gap:12px;
      }

      .btn{
        width:calc(50% - 6px);
        min-width:140px;
        height:52px;
        font-size:20px;
        padding:0 18px;
      }

      .scanlines{ opacity:.09; }
    }

    /* Respect people who turn off motion */
    @media (prefers-reduced-motion: reduce){
      .crt-grid, .crt-glass, .scanbar, .cursor{ animation:none; }
      .scanbar{ display:none; }
    }
  </style>
</head>

<body>
  <div class="crt-grid" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="crt-glass" aria-hidden="true"></div>
  <div class="scanbar" aria-hidden="true"></div>

  <!-- Mobile header -->
  <header class="mobile-topbar">
    <div class="brand">ARYAN</div>
    <button id="hamburger" class="hamburger" aria-label="Open menu">☰</button>
  </header>

  <!-- Mobile menu -->
  <nav id="mobileMenu" class="mobile-menu">
    <div class="menu-grid">
      <a class="mobile-link" href="https://calendar.google.com/" target="_blank">Calendar</a>
      <a class="mobile-link" href="https://github.com/dashboard" target="_blank">GitHub</a>
      <a class="mobile-link" href="https://chatgpt.com/" target="_blank">ChatGPT</a>
      <a class="mobile-link" href="https://www.google.com/" target="_blank">Google</a>
      <a class="mobile-link" href="#home" onclick="location.reload();return false;">Home</a>
    </div>
  </nav>

  <!-- Main content -->
  <main class="wrap">
    <section class="card">
      <p class="prompt" aria-hidden="true">C:\ARYAN&gt; boot.exe</p>
      <h1>Welcome back Aryan<span class="cursor" aria-hidden="true"></span></h1>
      <p class="subtitle" id="subtitle" aria-label="System online · Access your hub">SYSTEM ONLINE · ACCESS YOUR HUB</p>
      <nav class="cta">
        <a class="btn" href="https://calendar.google.com/" target="_blank">Calendar</a>
        <a class="btn" href="https://github.com/dashboard" target="_blank">GitHub</a>
        <a class="btn" href="https://chatgpt.com/" target="_blank">ChatGPT</a>
        <a class="btn" href="https://www.google.com/" target="_blank">Google</a>
        <a class="btn" href="#home" onclick="location.reload();return false;">Home</a>
      </nav>
    </section>
  </main>

  <!-- Mobile menu script -->
  <script>
    (function(){
      const btn = document.getElementById('hamburger');
      const menu = document.getElementById('mobileMenu');
      if(!btn || !menu) return;

      btn.onclick = () => {
        menu.classList.toggle('open');
      };

      menu.onclick = e => {
        if(e.target.closest('a')){
          menu.classList.remove('open');
        }
      };
    })();

    /* NEW: typewriter effect on the subtitle */
    (function(){
      const el = document.getElementById('subtitle');
      if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const text = el.textContent;
      el.textContent = '';
      let i = 0;
      setTimeout(function type(){
        el.textContent = text.slice(0, ++i);
        if(i < text.length) setTimeout(type, 45 + Math.random() * 60);
      }, 900);
    })();
  </script>
</body>
</html>
