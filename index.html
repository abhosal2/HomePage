<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aryan | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05060f;
      --grid:#0b1630;
      --neon-blue:#24c8ff;
      --neon-red:#ff3b4e;
      --text:#e9f3ff;
      --maxw: 1000px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background: var(--bg);
      overflow:hidden;
    }

    .scene{
      position:fixed; inset:0; overflow:hidden;
      perspective: 900px;
      background: radial-gradient(1200px 800px at 20% 10%, rgba(36,200,255,.06), transparent 60%),
                  radial-gradient(1100px 780px at 85% 20%, rgba(255,59,78,.06), transparent 60%),
                  radial-gradient(1000px 700px at 50% 120%, rgba(36,200,255,.05), transparent 70%);
    }

    .stars, .stars:before, .stars:after{
      content:""; position:absolute; inset:-20%;
      background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 3px 3px; opacity:.15;
      animation: drift 120s linear infinite;
    }
    .stars:before{opacity:.25; filter:blur(.5px); animation-duration: 160s}
    .stars:after{opacity:.08; filter:blur(1px); animation-duration: 200s}
    @keyframes drift{to{transform:translate3d(-200px, -120px, 0)}}

    .sweeps{
      position:absolute; inset:0; pointer-events:none; mix-blend-mode: screen;
      background:
        radial-gradient(400px 220px at -10% 60%, rgba(36,200,255,.25), transparent 65%),
        radial-gradient(380px 220px at 110% 40%, rgba(255,59,78,.22), transparent 65%);
      animation: sweepMove 14s ease-in-out infinite alternate;
    }
    @keyframes sweepMove{
      0%{transform:translate3d(-6%, -4%, 0)}
      100%{transform:translate3d(6%, 5%, 0)}
    }

    .grid{
      position:absolute; left:-5vw; right:-5vw; bottom:-15vh; height:80vh;
      transform: rotateX(62deg) translateZ(-200px);
      transform-origin: top center; filter: drop-shadow(0 0 12px rgba(36,200,255,.25));
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 50px 50px; background-position: center;
    }
    .grid:before{
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(600px 120px at 50% 0%, rgba(36,200,255,.18), transparent 70%),
        radial-gradient(500px 110px at 50% 10%, rgba(255,59,78,.12), transparent 75%);
      pointer-events:none;
    }
    .grid-lines{
      position:absolute; inset:0; background: repeating-linear-gradient( to bottom, transparent 0 48px, rgba(36,200,255,.5) 49px 50px );
      -webkit-mask: linear-gradient(to top, transparent, black 30%);
              mask: linear-gradient(to top, transparent, black 30%);
      mix-blend-mode: screen; opacity:.25; animation: gridPulse 2.6s ease-in-out infinite;
    }
    @keyframes gridPulse{ 50%{opacity:.38} }

    .scanline{
      position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.06), transparent);
      background-size: 100% 180px; animation: scan 4.2s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes scan{ to{background-position-y: 180px} }

    .wrap{ position:relative; z-index:10; min-height:100dvh; display:grid; place-items:center; text-align:center; padding: clamp(16px, 3vw, 40px); }

    .card{
      width:min(92vw, var(--maxw));
      backdrop-filter: blur(8px) saturate(120%);
      background: rgba(5,8,18,.45);
      border: 1px solid rgba(36,200,255,.18);
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(36,200,255,.12), 0 0 80px rgba(255,59,78,.08) inset;
      padding: clamp(20px, 5vw, 56px);
    }

    h1{
      font-family: 'Orbitron', ui-sans-serif;
      font-weight:900; letter-spacing:.04em; line-height:1.02;
      font-size: clamp(36px, 8vw, 86px);
      margin: 0 0 16px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        0 0 6px rgba(36,200,255,.65),
        0 0 18px rgba(36,200,255,.35),
        0 0 36px rgba(255,59,78,.2);
    }

    .subtitle{
      font-family: 'Orbitron', ui-sans-serif; letter-spacing:.12em; text-transform:uppercase;
      opacity:.88; margin-bottom: 28px; font-size: clamp(12px, 2.6vw, 16px);
    }

    .cta{
      display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:center;
    }

    .btn{
      --h: 52px;
      height: var(--h); padding: 0 22px; border-radius: 14px;
      display:inline-grid; place-items:center; text-decoration:none; position:relative;
      font-family:'Orbitron', ui-sans-serif; font-weight:700; letter-spacing:.06em;
      color: var(--text); isolation:isolate;
      border:1px solid rgba(36,200,255,.45);
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
      background: linear-gradient( to bottom, rgba(8,26,46,.7), rgba(6,16,34,.6) );
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,59,78,.6); box-shadow: 0 0 18px rgba(255,59,78,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .btn:active{ transform: translateY(0); }

    .btn.blue:before, .btn.red:before{
      content:""; position:absolute; inset:-2px; border-radius:inherit; z-index:-1; filter: blur(10px);
    }
    .btn.blue:before{ background: radial-gradient(60% 120% at 50% 80%, rgba(36,200,255,.45), transparent 70%); }
    .btn.red:before{ background: radial-gradient(60% 120% at 50% 80%, rgba(255,59,78,.45), transparent 70%); }

    .footer{ margin-top: 20px; opacity:.7; font-size: 12px }

    @media (prefers-reduced-motion: reduce){
      .sweeps, .grid-lines, .scanline, .stars{ animation: none !important }
    }
      .audio-toggle{
      position: fixed; right: 16px; bottom: 16px; z-index: 20;
      width: 44px; height: 44px; border-radius: 12px; border:1px solid rgba(36,200,255,.45);
      background: linear-gradient( to bottom, rgba(8,26,46,.9), rgba(6,16,34,.85) );
      color: var(--text); font-size: 18px; cursor: pointer;
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .audio-toggle:hover{ transform: translateY(-1px); border-color: rgba(255,59,78,.6); box-shadow: 0 0 18px rgba(255,59,78,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .audio-toggle:active{ transform: translateY(0); }
      .audio-toggle{
      position: fixed; right: 16px; bottom: 16px; z-index: 20;
      width: 44px; height: 44px; border-radius: 12px; border:1px solid rgba(36,200,255,.45);
      background: linear-gradient( to bottom, rgba(8,26,46,.9), rgba(6,16,34,.85) );
      color: var(--text); font-size: 18px; cursor: pointer;
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .audio-toggle:hover{ transform: translateY(-1px); border-color: rgba(255,59,78,.6); box-shadow: 0 0 18px rgba(255,59,78,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .audio-toggle:active{ transform: translateY(0); }

    /* ===== INTRO (Disney-like) ===== */
    .intro{ position:fixed; inset:0; z-index: 50; display:grid; place-items:center; background: radial-gradient(800px 500px at 50% 30%, rgba(36,200,255,.12), transparent 60%), #04050b; overflow:hidden; }
    .intro__stars, .intro__stars::before, .intro__stars::after{ content:""; position:absolute; inset:-10%; background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px); background-size: 3px 3px; animation:introDrift 120s linear infinite; opacity:.2; }
    .intro__stars::before{ opacity:.35; filter:blur(.6px); animation-duration:160s }
    .intro__stars::after{ opacity:.1; filter:blur(1.2px); animation-duration:200s }
    @keyframes introDrift{ to{ transform: translate3d(-200px,-120px,0) } }

    .intro__wrap{ position:relative; width:min(92vw, 1000px); aspect-ratio: 16/9; display:grid; place-items:center; }

    /* Logo text */
    .intro__title{ position:absolute; bottom:18%; width:100%; text-align:center; font-family:'Orbitron', ui-sans-serif; text-transform:uppercase; letter-spacing:.08em; font-weight:900; font-size:clamp(28px,7vw,76px); color:#eaf7ff; text-shadow: 0 0 10px rgba(36,200,255,.8), 0 0 26px rgba(36,200,255,.35), 0 0 60px rgba(255,59,78,.25); opacity:0; transform:translateY(16px) scale(.98); animation:introTitle 1500ms ease-out 1800ms forwards; }
    @keyframes introTitle{ to{ opacity:1; transform:translateY(0) scale(1) } }

    /* Glow sweep over title */
    .intro__title:after{ content:""; position:absolute; left:-20%; top:0; width:60%; height:100%; background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,.85) 45%, transparent 70%); filter: blur(4px); transform: skewX(-20deg) translateX(-120%); animation: introSheen 1200ms ease 2500ms forwards; mix-blend-mode: screen; }
    @keyframes introSheen{ to{ transform: skewX(-20deg) translateX(320%) } }

    /* Arc light trail (SVG path reveal) */
    .intro__arc{ position:absolute; inset:0; display:block; }
    .intro__arc path{ stroke:url(#arcGrad); stroke-width:4; fill:none; filter: drop-shadow(0 0 8px rgba(36,200,255,.6)) drop-shadow(0 0 16px rgba(36,200,255,.35)); stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: drawArc 1600ms ease-out 200ms forwards; }
    @keyframes drawArc{ to{ stroke-dashoffset: 0 } }

    /* Shooting star traveling along the arc */
    .intro__spark{ position:absolute; width:14px; height:14px; border-radius:50%; background: radial-gradient(circle, #fff, #8be4ff 60%, transparent 70%); filter: drop-shadow(0 0 12px rgba(36,200,255,.9)); offset-path: path('M 0 420 C 240 260, 760 260, 1000 420'); offset-rotate: 0deg; top:0; left:0; transform: translate(-7px,-7px); animation: sparkMove 1600ms ease-out 200ms forwards; }
    @keyframes sparkMove{ to{ offset-distance: 100% } }

    /* Castle-ish silhouette lines (simple Tron braces) */
    .intro__gridline{ position:absolute; bottom:22%; left:50%; width:60%; height:2px; transform:translateX(-50%); background: linear-gradient(90deg, transparent, rgba(36,200,255,.55), transparent); box-shadow: 0 0 16px rgba(36,200,255,.4); opacity:0; animation: lineIn 800ms ease-out 1200ms forwards; }
    @keyframes lineIn{ to{ opacity:1 } }

    /* Fade out */
    .intro--hide{ animation: introOut 900ms ease forwards; pointer-events:none; }
    @keyframes introOut{ to{ opacity:0; visibility:hidden } }

    /* Skip button */
    .intro__skip{ position:absolute; right:16px; top:16px; z-index:60; border:1px solid rgba(36,200,255,.45); border-radius:10px; padding:6px 10px; background: rgba(8,26,46,.7); color:var(--text); font-family:'Orbitron', ui-sans-serif; letter-spacing:.06em; cursor:pointer; }
    .intro__skip:hover{ border-color: rgba(255,59,78,.6) }

    @media (prefers-reduced-motion: reduce){
      .intro__spark, .intro__arc path, .intro__title, .intro__stars{ animation:none !important }
    }
  </style>
  <script>
    // Accessibility helpers will be added after DOM loads
  </script>
</head>
<body>
  <!-- INTRO OVERLAY -->
  <div class="intro" id="intro" role="dialog" aria-label="Opening animation" aria-modal="true">
    <div class="intro__stars"></div>
    <button class="intro__skip" id="skipIntro" title="Skip">Skip</button>
    <div class="intro__wrap">
      <!-- Arc as SVG sized to container -->
      <svg class="intro__arc" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#24c8ff"/>
            <stop offset="50%" stop-color="#9be7ff"/>
            <stop offset="100%" stop-color="#ff3b4e"/>
          </linearGradient>
        </defs>
        <!-- Curved arc similar vibe to Disney swoosh -->
        <path d="M 0 420 C 240 260, 760 260, 1000 420"/>
      </svg>
      <div class="intro__spark"></div>
      <div class="intro__gridline"></div>
      <div class="intro__title">Welcome back, Aryan</div>
    </div>
  </div>

  <!-- Background Music (user-activated due to browser autoplay policies) -->
  <audio id="bgm" preload="auto" loop>
    <source src="end_of_line.mp3" type="audio/mpeg">
  </audio>

  <!-- Small on-screen audio toggle -->
  <button id="audioToggle" class="audio-toggle" aria-label="Play background music" aria-pressed="false" title="Toggle music (End of Line – Daft Punk)">🔇</button>
  <!-- Background Music -->
  <audio autoplay loop volume="0.1">
    <source src="end_of_line.mp3" type="audio/mpeg">
  </audio>

  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="sweeps"></div>
    <div class="grid">
      <div class="grid-lines"></div>
    </div>
    <div class="scanline"></div>
  </div>

  <main class="wrap">
    <section class="card" role="region" aria-label="Welcome">
      <h1>Welcome back, Aryan</h1>
      <p class="subtitle">SYSTEM ONLINE · ACCESS YOUR HUB</p>
      <nav class="cta" aria-label="Primary">
        <a class="btn blue" href="https://calendar.google.com/" target="_blank" rel="noopener">Google Calendar</a>
        <a class="btn red" href="https://outlook.office.com/" target="_blank" rel="noopener">Outlook</a>
        <a class="btn" href="#home" onclick="location.reload();return false;">Home</a>
      </nav>
      <p class="footer">Music: “End of Line” — Daft Punk (Tron Legacy OST). Make sure to include your own local or royalty‑free version as <code>end_of_line.mp3</code>.</p>
    </section>
  </main>
  <script>
    (function(){
      const btn = document.getElementById('audioToggle');
      const audio = document.getElementById('bgm');
      if(!btn || !audio) return;

      // Set desired volume
      audio.volume = 0.12; // ~12% volume

      // Try to start silently (some browsers allow muted autoplay)
      audio.muted = true;
      audio.play().catch(()=>{/* expected until user interacts */});

      function updateIcon(){
        const playing = !audio.paused;
        btn.textContent = playing ? '🔊' : '🔇';
        btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
        btn.setAttribute('aria-label', playing ? 'Pause background music' : 'Play background music');
      }

      btn.addEventListener('click', async () => {
        try{
          if(audio.paused){
            audio.muted = false; // unmute when user interacts
            audio.volume = 0.12;
            await audio.play();
          }else{
            audio.pause();
          }
        }catch(e){
          console.warn('Audio toggle error:', e);
        }
        updateIcon();
      });

      // Keyboard accessibility
      btn.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); }
      });

      // Initialize icon state
      updateIcon();
    })();
  </script>
  <script>
    (function(){
      const intro = document.getElementById('intro');
      const skip = document.getElementById('skipIntro');
      const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Play once per session
      const played = sessionStorage.getItem('introPlayed');
      function endIntro(){
        if(!intro) return;
        intro.classList.add('intro--hide');
        setTimeout(()=>{ intro.style.display='none'; }, 900);
        sessionStorage.setItem('introPlayed','1');
      }

      if(played || REDUCED){
        // Skip immediately for reduced motion or if already viewed
        endIntro();
      }else{
        // Auto end after ~3.8s after title settles (~3.2s total anims)
        setTimeout(endIntro, 3800);
      }

      skip?.addEventListener('click', endIntro);
    })();

    // Existing audio toggle logic
    (function(){
      const btn = document.getElementById('audioToggle');
      const audio = document.getElementById('bgm');
      if(!btn || !audio) return;
      audio.volume = 0.12;
      audio.muted = true;
      audio.play().catch(()=>{});
      function updateIcon(){
        const playing = !audio.paused;
        btn.textContent = playing ? '🔊' : '🔇';
        btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
        btn.setAttribute('aria-label', playing ? 'Pause background music' : 'Play background music');
      }
      btn.addEventListener('click', async () => {
        try{
          if(audio.paused){ audio.muted = false; audio.volume = 0.12; await audio.play(); }
          else{ audio.pause(); }
        }catch(e){ console.warn('Audio toggle error:', e); }
        updateIcon();
      });
      btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); btn.click(); } });
      updateIcon();
    })();
  </script>
</body>
</html>
