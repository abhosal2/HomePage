<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aryan | Home</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05060f;
      --crt-green:#19ff5e;
      --text:#c9ffd8;
      --maxw:1000px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      font-family:'VT323',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--text);
      background:#000;
      overflow:hidden;
      opacity:0;
      animation: fadeIn 1.2s ease forwards;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Snake LCD: a canvas of chunky pixel cells, updated frame by frame */
    #snake{
      position:fixed;
      inset:0;
      z-index:-2;
      display:block;
      image-rendering:pixelated;
    }

    /* Bottom phosphor glow that used to live on the grid */
    .lcd-glow{
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      box-shadow:inset 0 -160px 120px -40px rgba(25,255,94,0.18);
    }

    /* Scanlines above the content so text looks like it's on the tube */
    .scanlines{
      position:fixed;
      inset:0;
      z-index:2000;
      pointer-events:none;
      opacity:.12;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.9) 0 1px,
          transparent 1px 3px
        );
    }

    /* Vignette + faint flicker, like curved CRT glass */
    .crt-glass{
      position:fixed;
      inset:0;
      z-index:2001;
      pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%      { opacity: .94; }
    }

    /* Slow rolling bright band */
    .scanbar{
      position:fixed;
      left:0;
      right:0;
      top:-20%;
      height:20%;
      z-index:2002;
      pointer-events:none;
      background:linear-gradient(to bottom, transparent, rgba(25,255,94,.06), transparent);
      animation: roll 7s linear infinite;
    }

    @keyframes roll {
      to { top: 110%; }
    }

    .wrap{
      position:relative;
      z-index:1;
      height:100vh;
      display:grid;
      place-items:center;
      text-align:center;
      padding:40px;
    }

    @supports (height: 100svh){
      .wrap{ height:100svh; }
    }

    .card{
      width:min(92vw,var(--maxw));
      background:rgba(0,0,0,.6);
      border:1px solid rgba(25,255,94,.35);
      border-radius:6px;               /* squarer, like an LCD bezel */
      box-shadow:
        0 0 24px rgba(25,255,94,.2) inset,
        0 0 40px rgba(0,0,0,.6);
      padding:40px;
    }

    /* Terminal prompt line above the title */
    .prompt{
      font-size:clamp(16px,2.6vw,22px);
      letter-spacing:2px;
      color:rgba(25,255,94,.6);
      text-align:left;
      margin-bottom:14px;
    }

    h1{
      font-size:clamp(40px,12vw,120px);
      line-height:.9;
      letter-spacing:4px;
      text-transform:uppercase;
      color:var(--crt-green);
      text-shadow:
        -2px 0 rgba(255,40,80,.35),
         2px 0 rgba(40,160,255,.35),
         0 0 6px rgba(25,255,94,.9),
         0 0 18px rgba(25,255,94,.5),
         0 0 32px rgba(25,255,94,.35);
      -webkit-text-stroke:2px rgba(0,0,0,.6);
      margin-bottom:18px;
    }

    /* Blinking block cursor */
    .cursor{
      display:inline-block;
      width:.5em;
      height:.8em;
      margin-left:.1em;
      vertical-align:baseline;
      background:var(--crt-green);
      box-shadow:0 0 12px rgba(25,255,94,.8);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .subtitle{
      font-size:clamp(16px,3.2vw,26px);
      letter-spacing:4px;
      text-transform:uppercase;
      color:#a9ffc7;
      opacity:.9;
      margin-bottom:28px;
      min-height:1.2em;
    }

    .cta{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      align-items:center;
      justify-content:center;
    }

    .btn{
      height:56px;
      padding:0 26px;
      border-radius:4px;
      text-decoration:none;
      display:grid;
      grid-auto-flow:column;
      place-items:center;
      color:var(--crt-green);
      font-size:22px;
      letter-spacing:2px;
      text-transform:uppercase;
      border:1px solid rgba(25,255,94,.4);
      background:rgba(0,0,0,.65);
      box-shadow:
        0 0 14px rgba(25,255,94,.25) inset,
        0 0 18px rgba(25,255,94,.18);
      transition:
        transform .12s ease,
        box-shadow .2s ease,
        border-color .2s ease;
      touch-action:manipulation;
    }

    .btn::before{ content:"[ "; opacity:.5; }
    .btn::after { content:" ]"; opacity:.5; }

    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-1px);
      color:#000;
      background:var(--crt-green);
      border-color:var(--crt-green);
      outline:none;
      box-shadow:
        0 0 18px rgba(25,255,94,.6),
        0 0 36px rgba(25,255,94,.35);
    }

    /* Mobile menu */
    .mobile-topbar,
    .mobile-menu{
      display:none;
    }

    @media (max-width: 640px){
      :root{
        --maxw:560px;
      }

      body{ overflow:auto; }

      .mobile-topbar{
        position:fixed;
        top:0;
        left:0;
        right:0;
        z-index:1000;
        height:56px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 14px;
        background:rgba(0,0,0,.7);
        border-bottom:1px solid rgba(25,255,94,.35);
        box-shadow:0 6px 16px rgba(0,0,0,.5);
        backdrop-filter:blur(6px);
      }

      .brand{
        color:var(--crt-green);
        font-size:24px;
        letter-spacing:3px;
        text-transform:uppercase;
        text-shadow:
          0 0 6px rgba(25,255,94,.7),
          0 0 16px rgba(25,255,94,.3);
      }

      .hamburger{
        width:44px;
        height:44px;
        border-radius:4px;
        border:1px solid rgba(25,255,94,.45);
        background:rgba(0,0,0,.85);
        color:var(--text);
        font-size:22px;
        cursor:pointer;
        display:grid;
        place-items:center;
        box-shadow:
          0 0 12px rgba(25,255,94,.22) inset,
          0 0 22px rgba(25,255,94,.16);
      }

      .mobile-menu{
        position:fixed;
        top:56px;
        left:0;
        right:0;
        z-index:999;
        display:block;
        transform:translateY(-110%);
        transition:transform .22s ease;
        background:rgba(0,0,0,.9);
        border-bottom:1px solid rgba(25,255,94,.35);
        backdrop-filter:blur(6px);
      }

      .mobile-menu.open{
        transform:translateY(0);
      }

      .menu-grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
        padding:14px;
      }

      .mobile-link{
        height:48px;
        display:grid;
        place-items:center;
        text-decoration:none;
        border-radius:4px;
        border:1px solid rgba(25,255,94,.35);
        color:var(--crt-green);
        font-size:18px;
        letter-spacing:2px;
        text-transform:uppercase;
        background:rgba(0,0,0,.65);
        box-shadow:
          0 0 10px rgba(25,255,94,.18) inset,
          0 0 18px rgba(0,0,0,.45);
      }

      .wrap{
        padding:20px;
        padding-top:84px;
      }

      .card{
        padding:24px 18px;
      }

      h1{
        -webkit-text-stroke:1px rgba(0,0,0,.65);
        letter-spacing:2px;
        margin-bottom:14px;
      }

      .subtitle{
        letter-spacing:2px;
        margin-bottom:22px;
      }

      .cta{
        gap:12px;
      }

      .btn{
        width:calc(50% - 6px);
        min-width:140px;
        height:52px;
        font-size:20px;
        padding:0 18px;
      }

      .scanlines{ opacity:.09; }
    }

    /* Respect people who turn off motion */
    @media (prefers-reduced-motion: reduce){
      .crt-glass, .scanbar, .cursor{ animation:none; }
      .scanbar{ display:none; }
    }
  </style>
</head>

<body>
  <canvas id="snake" aria-hidden="true"></canvas>
  <div class="lcd-glow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="crt-glass" aria-hidden="true"></div>
  <div class="scanbar" aria-hidden="true"></div>

  <!-- Mobile header -->
  <header class="mobile-topbar">
    <div class="brand">ARYAN</div>
    <button id="hamburger" class="hamburger" aria-label="Open menu">☰</button>
  </header>

  <!-- Mobile menu -->
  <nav id="mobileMenu" class="mobile-menu">
    <div class="menu-grid">
      <a class="mobile-link" href="https://calendar.google.com/" target="_blank">Calendar</a>
      <a class="mobile-link" href="https://github.com/dashboard" target="_blank">GitHub</a>
      <a class="mobile-link" href="https://claude.ai/" target="_blank">Claude</a>
      <a class="mobile-link" href="https://www.google.com/" target="_blank">Google</a>
      <a class="mobile-link" href="#home" onclick="location.reload();return false;">Home</a>
    </div>
  </nav>

  <!-- Main content -->
  <main class="wrap">
    <section class="card">
      <p class="prompt" aria-hidden="true">C:\ARYAN&gt; boot.exe</p>
      <h1>Welcome back Aryan<span class="cursor" aria-hidden="true"></span></h1>
      <p class="subtitle" id="subtitle" aria-label="System online · Access your hub">SYSTEM ONLINE · ACCESS YOUR HUB</p>
      <nav class="cta">
        <a class="btn" href="https://calendar.google.com/" target="_blank">Calendar</a>
        <a class="btn" href="https://github.com/dashboard" target="_blank">GitHub</a>
        <a class="btn" href="https://claude.ai/" target="_blank">Claude</a>
        <a class="btn" href="https://www.google.com/" target="_blank">Google</a>
        <a class="btn" href="#home" onclick="location.reload();return false;">Home</a>
      </nav>
    </section>
  </main>

  <script>
    /* Mobile menu */
    (function(){
      const btn = document.getElementById('hamburger');
      const menu = document.getElementById('mobileMenu');
      if(!btn || !menu) return;
      btn.onclick = () => menu.classList.toggle('open');
      menu.onclick = e => {
        if(e.target.closest('a')) menu.classList.remove('open');
      };
    })();

    /* Typewriter effect on the subtitle */
    (function(){
      const el = document.getElementById('subtitle');
      if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const text = el.textContent;
      el.textContent = '';
      let i = 0;
      setTimeout(function type(){
        el.textContent = text.slice(0, ++i);
        if(i < text.length) setTimeout(type, 45 + Math.random() * 60);
      }, 900);
    })();

    /* Snake LCD background: discrete grid steps, no smooth motion */
    (function(){
      const canvas = document.getElementById('snake');
      const ctx = canvas.getContext('2d');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const OFF   = 'rgba(25,255,94,0.07)';  // unlit LCD pixel
      const ON    = '#19ff5e';               // lit pixel
      const HEAD  = '#b8ffcf';
      const TICK  = 110;                     // ms per frame (Nokia-ish speed)
      const MAX_LEN = 70;

      let cell, cols, rows, w, h;
      let snake, dir, food, grow, dying, frame = 0, timer;

      const rand = n => Math.floor(Math.random() * n);
      const wrap = (v, m) => (v + m) % m;
      const wdist = (a, b, m) => { const d = Math.abs(a - b); return Math.min(d, m - d); };
      const occupied = (x, y, skipTail) => {
        const end = skipTail ? snake.length - 1 : snake.length;
        for(let i = 0; i < end; i++) if(snake[i].x === x && snake[i].y === y) return true;
        return false;
      };

      function resize(){
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        cell = w <= 640 ? 16 : 22;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.ceil(w / cell);
        rows = Math.ceil(h / cell);
        reset();
        draw();
      }

      function reset(){
        const x = Math.floor(cols / 5), y = Math.floor(rows * 0.75);
        snake = [];
        for(let i = 0; i < 6; i++) snake.push({ x: x - i, y });
        dir = { x: 1, y: 0 };
        grow = 0;
        dying = 0;
        placeFood();
      }

      function placeFood(){
        do { food = { x: rand(cols), y: rand(rows) }; }
        while(occupied(food.x, food.y));
      }

      // Simple greedy "player": head toward food, never reverse, avoid own body
      function chooseDir(){
        const head = snake[0];
        const options = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]
          .filter(d => !(d.x === -dir.x && d.y === -dir.y));
        let best = null, bestScore = Infinity;
        for(const d of options){
          const nx = wrap(head.x + d.x, cols), ny = wrap(head.y + d.y, rows);
          if(occupied(nx, ny, true)) continue;
          let score = wdist(nx, food.x, cols) + wdist(ny, food.y, rows);
          if(d.x === dir.x && d.y === dir.y) score -= 0.5;  // prefer going straight
          score += Math.random() * 0.8;                      // a little human wobble
          if(score < bestScore){ bestScore = score; best = d; }
        }
        return best;
      }

      function step(){
        frame++;
        if(dying){
          // Classic game-over blink, then restart
          if(--dying === 0) reset();
          draw();
          return;
        }
        const d = chooseDir();
        if(!d){ dying = 8; draw(); return; }
        dir = d;
        const head = { x: wrap(snake[0].x + dir.x, cols), y: wrap(snake[0].y + dir.y, rows) };
        snake.unshift(head);
        if(head.x === food.x && head.y === food.y){
          grow += 3;
          placeFood();
        }
        if(grow > 0) grow--; else snake.pop();
        if(snake.length >= MAX_LEN) dying = 8;
        draw();
      }

      function pixel(x, y, color, inset){
        ctx.fillStyle = color;
        ctx.fillRect(x * cell + inset, y * cell + inset, cell - inset * 2, cell - inset * 2);
      }

      function draw(){
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        // Unlit LCD cells: the faint ghost grid
        const gap = Math.max(2, Math.round(cell * 0.12));
        ctx.fillStyle = OFF;
        for(let y = 0; y < rows; y++){
          for(let x = 0; x < cols; x++){
            ctx.fillRect(x * cell + gap, y * cell + gap, cell - gap * 2, cell - gap * 2);
          }
        }

        // Food: a tiny 4-pixel diamond inside one cell, blinking
        if(frame % 6 < 4){
          const s = Math.floor(cell / 3), ox = food.x * cell, oy = food.y * cell;
          ctx.fillStyle = ON;
          ctx.fillRect(ox + s,     oy,         s, s);
          ctx.fillRect(ox,         oy + s,     s, s);
          ctx.fillRect(ox + 2 * s, oy + s,     s, s);
          ctx.fillRect(ox + s,     oy + 2 * s, s, s);
        }

        // Snake: hidden on alternate frames while "dying"
        if(dying && dying % 2) return;
        ctx.shadowColor = 'rgba(25,255,94,0.7)';
        ctx.shadowBlur = 8;
        for(let i = snake.length - 1; i >= 0; i--){
          pixel(snake[i].x, snake[i].y, i === 0 ? HEAD : ON, gap);
        }
        ctx.shadowBlur = 0;
      }

      let resizeTimer;
      addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 150);
      });

      resize();
      if(!reduced){
        timer = setInterval(() => { if(!document.hidden) step(); }, TICK);
      }
    })();
  </script>
</body>
</html>
