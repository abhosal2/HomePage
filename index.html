<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aryan | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05060f;
      --grid-blue:#24c8ff;
      --grid-red:#ff3b4e;
      --text:#e9f3ff;
      --maxw: 1000px;
    }

    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background: var(--bg);
      overflow:hidden;
    }

    /* Tron grid background - blue and red mix */
    body::before{
      content:"";
      position:fixed; inset:0;
      background-image:
        linear-gradient(var(--grid-blue) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-red) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center;
      transform: rotateX(60deg) translateY(200px);
      transform-origin: center;
      filter: drop-shadow(0 0 8px var(--grid-blue)) drop-shadow(0 0 6px var(--grid-red));
      z-index:-1;
    }

    .wrap{ position:relative; z-index:10; height:100vh; display:grid; place-items:center; text-align:center; padding:40px; }

    .card{
      width:min(92vw, var(--maxw));
      backdrop-filter: blur(8px) saturate(120%);
      background: rgba(5,8,18,.45);
      border: 1px solid rgba(36,200,255,.35);
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(36,200,255,.18), 0 0 80px rgba(255,59,78,.12) inset;
      padding: 40px;
    }

    h1{
      font-family: 'Orbitron', ui-sans-serif;
      font-weight:900; letter-spacing:.06em; line-height:1.02;
      font-size: clamp(44px, 9vw, 100px);
      margin-bottom:16px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        0 0 8px rgba(36,200,255,.7),
        0 0 16px rgba(36,200,255,.4),
        0 0 24px rgba(255,59,78,.4),
        0 0 60px rgba(255,59,78,.2);
    }

    .subtitle{
      font-family: 'Orbitron', ui-sans-serif; letter-spacing:.12em; text-transform:uppercase;
      opacity:.85; margin-bottom: 28px; font-size: clamp(12px, 2.6vw, 16px);
    }

    .cta{
      display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:center;
    }

    .btn{
      --h: 52px;
      height: var(--h); padding: 0 22px; border-radius: 14px;
      display:inline-grid; place-items:center; text-decoration:none; position:relative;
      font-family:'Orbitron', ui-sans-serif; font-weight:700; letter-spacing:.06em;
      color: var(--text);
      border:1px solid rgba(36,200,255,.45);
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
      background: linear-gradient( to bottom, rgba(8,26,46,.7), rgba(6,16,34,.6) );
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(36,200,255,.8); box-shadow: 0 0 20px rgba(36,200,255,.35), 0 0 28px rgba(36,200,255,.28) inset; }
    .btn:active{ transform: translateY(0); }

    .footer{ margin-top: 20px; opacity:.7; font-size: 12px }

    /* Audio Toggle */
    .audio-toggle{
      position: fixed; right: 16px; bottom: 16px; z-index: 200;
      width: 44px; height: 44px; border-radius: 12px; border:1px solid rgba(36,200,255,.45);
      background: linear-gradient( to bottom, rgba(8,26,46,.9), rgba(6,16,34,.85) );
      color: var(--text); font-size: 18px; cursor: pointer;
      box-shadow: 0 0 16px rgba(36,200,255,.22) inset, 0 0 24px rgba(36,200,255,.16);
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .audio-toggle:hover{ transform: translateY(-1px); border-color: rgba(36,200,255,.8); box-shadow: 0 0 18px rgba(36,200,255,.25), 0 0 28px rgba(36,200,255,.28) inset; }
    .audio-toggle:active{ transform: translateY(0); }
  </style>
</head>
<body>
  <audio id="bgm" preload="auto" loop>
    <source src="end_of_line.mp3" type="audio/mpeg">
  </audio>

  <button id="audioToggle" class="audio-toggle" aria-label="Play background music" aria-pressed="false">🔇</button>

  <main class="wrap">
    <section class="card">
      <h1>Welcome back, Aryan</h1>
      <p class="subtitle">SYSTEM ONLINE · ACCESS YOUR HUB</p>
      <nav class="cta">
        <a class="btn" href="https://calendar.google.com/" target="_blank">Google Calendar</a>
        <a class="btn" href="https://outlook.office.com/" target="_blank">Outlook</a>
        <a class="btn" href="#home" onclick="location.reload();return false;">Home</a>
      </nav>
      <p class="footer">Music: “End of Line” — Daft Punk (Tron Legacy OST). Place <code>end_of_line.mp3</code> beside this file.</p>
    </section>
  </main>

  <script>
    (function(){
      const btn = document.getElementById('audioToggle');
      const audio = document.getElementById('bgm');
      if(!btn || !audio) return;
      audio.volume = 0.14;
      function updateIcon(){
        const playing = !audio.paused;
        btn.textContent = playing ? '🔊' : '🔇';
      }
      function toggle(){
        if(audio.paused){ audio.muted = false; audio.play().catch(()=>{}); }
        else{ audio.pause(); }
        updateIcon();
      }
      btn.addEventListener('click', toggle);
      updateIcon();
    })();
  </script>
</body>
</html>
